<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5d56"><title>Inquiry received | Galena Park Kennel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf8f5,#fff7e7);font-family:"DM Sans",sans-serif;color:#173330;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #dce6e3;border-radius:28px;padding:48px;box-shadow:0 20px 60px rgba(15,55,49,.12);text-align:center}.paw{width:62px;height:62px;border-radius:18px;background:#0b5d56;color:white;display:grid;place-items:center;margin:0 auto 20px;font-size:30px}h1{font:800 42px/1.05 Manrope,sans-serif;letter-spacing:-.04em;margin:0 0 16px}p{color:#657875;font-size:17px}.button{display:inline-block;margin-top:16px;background:#0b5d56;color:white;padding:13px 20px;border-radius:999px;text-decoration:none;font-weight:700}</style></head><body><main class="card"><div class="paw">🐾</div><h1>Thanks for reaching out.</h1><p>Your adoption inquiry was submitted. Kennel staff can confirm the dog’s current availability and next steps.</p><a class="button" href="/">Back to the dogs</a></main></body></html>